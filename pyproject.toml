[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugfix-agent"
version = "0.1.0"
description = "Autonomous bug-fixing agent: LangGraph + Groq + Docker sandbox + human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "pydantic>=2.7",
    "tenacity>=8.5",
    "docker>=7.1",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]
ui = ["streamlit>=1.40", "fpdf2>=2.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: requires a running Docker daemon (auto-skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

